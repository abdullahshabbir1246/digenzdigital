<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIGENZ — Header Logo vs Logo Design Service Icon Reveal</title>
  <link href="https://fonts.googleapis.com/css?family=Bai+Jamjuree:400,600,700|Libre+Franklin:400,600,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 20px;
      background: #101827; /* DIGENZ Midnight Navy */
      font-family: 'Bai Jamjuree', sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-align: center;
    }
    p.sub {
      color: #80B5FF;
      font-size: 13px;
      margin-bottom: 25px;
      text-align: center;
    }
    .btn-replay {
      background: linear-gradient(135deg, #3478F6 0%, #1a56c4 100%);
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(52, 120, 246, 0.4);
      margin-bottom: 35px;
      transition: all 0.2s ease;
    }
    .btn-replay:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(52, 120, 246, 0.6);
    }

    .comparison-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(52, 120, 246, 0.25);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
    }
    .card h3 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #80B5FF;
      margin-top: 0;
      margin-bottom: 20px;
    }

    /* =============================================================
       1. REFERENCE: DIGENZ HEADER LOGO REVEAL (EXACT ORIGINAL)
       ============================================================= */
    .digenz-logo-anim-wrap {
      display: inline-flex;
      align-items: center;
      position: relative;
      height: 52px;
      line-height: 0;
    }
    .digenz-logo-anim-svg {
      height: 52px;
      width: auto;
      aspect-ratio: 350 / 92;
      display: block;
      overflow: visible;
      will-change: transform, filter;
      animation: logoEntranceGlow 1.8s ease-out forwards;
    }
    .d-streak {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 5px #3478F6) drop-shadow(0 0 10px #80B5FF);
      opacity: 0;
    }
    .streak-pillar {
      stroke: #80B5FF;
      stroke-width: 2.2;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: drawStreak 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
    }
    .streak-loop {
      stroke: #3478F6;
      stroke-width: 2.2;
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      animation: drawStreak 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
    }
    .streak-arc-top {
      stroke: #80B5FF;
      stroke-width: 1.8;
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      animation: drawStreak 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
    }
    .streak-arc-bottom {
      stroke: #3478F6;
      stroke-width: 1.8;
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      animation: drawStreak 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }
    .streak-arrow {
      stroke: #FFFFFF;
      stroke-width: 1.8;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: drawStreak 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
    }
    .d-facet {
      opacity: 0;
      transform-origin: 45px 46px;
      animation: assembleFacet 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }
    .d-arrow {
      opacity: 0;
      transform: translateX(-14px);
      animation: snapArrow 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.65s forwards;
    }
    .d-node {
      opacity: 0;
      transform-origin: center;
      animation: flashNode 0.5s ease-out 0.75s forwards;
    }
    .d-energy-beam {
      opacity: 0;
      transform: translateX(-60px);
      animation: sweepBeam 0.9s ease-out 0.7s forwards;
    }
    .wm-letter {
      opacity: 0;
      transform: translateX(-6px);
      animation: letterReveal 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .wm-d { animation-delay: 0.80s; }
    .wm-i { animation-delay: 0.87s; }
    .wm-g { animation-delay: 0.94s; }
    .wm-e { animation-delay: 1.01s; }
    .wm-n { animation-delay: 1.08s; }
    .wm-z { animation-delay: 1.15s; }
    .wm-tagline {
      opacity: 0;
      letter-spacing: 6px;
      animation: taglineReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
    }

    @keyframes drawStreak {
      0% { stroke-dashoffset: 220; opacity: 0; }
      20% { opacity: 1; }
      80% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes assembleFacet {
      0% { opacity: 0; transform: scale(0.85); }
      70% { opacity: 1; transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes snapArrow {
      0% { opacity: 0; transform: translateX(-14px) scale(0.8); }
      70% { opacity: 1; transform: translateX(1.5px) scale(1.06); }
      100% { opacity: 0.95; transform: translateX(0) scale(1); }
    }
    @keyframes flashNode {
      0% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(2.2); filter: drop-shadow(0 0 6px #FFFFFF); }
      100% { opacity: 1; transform: scale(1); filter: none; }
    }
    @keyframes sweepBeam {
      0% { opacity: 0; transform: translateX(-60px); }
      30% { opacity: 0.85; }
      80% { opacity: 0.6; }
      100% { opacity: 0; transform: translateX(330px); }
    }
    @keyframes letterReveal {
      0% { opacity: 0; transform: translateX(-6px); filter: drop-shadow(0 0 10px #3478F6); }
      60% { opacity: 1; filter: drop-shadow(0 0 6px #80B5FF); }
      100% { opacity: 1; transform: translateX(0); filter: none; }
    }
    @keyframes taglineReveal {
      0% { opacity: 0; letter-spacing: 6px; }
      100% { opacity: 0.95; letter-spacing: 3.8px; }
    }
    @keyframes logoEntranceGlow {
      0% { filter: drop-shadow(0 0 4px rgba(52, 120, 246, 0.2)); }
      50% { filter: drop-shadow(0 0 12px rgba(52, 120, 246, 0.65)) drop-shadow(0 0 4px rgba(128, 181, 255, 0.8)); }
      100% { filter: drop-shadow(0 0 0px transparent); }
    }

    /* =============================================================
       2. LOGO DESIGN SERVICE ICON: EXACT SAME TECHNIQUE
       ============================================================= */
    .service-item-mock {
      display: inline-block;
      text-align: center;
      width: 140px;
    }
    .service-figure {
      width: 76px;
      height: 76px;
      margin: 0 auto 12px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .service-3d-underlay {
      width: 68px;
      height: 68px;
      object-fit: contain;
      display: block;
      position: absolute;
      top: 4px;
      left: 4px;
      z-index: 1;
      opacity: 0;
      filter: drop-shadow(0 4px 14px rgba(52, 120, 246, 0.32));
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.35s ease;
    }
    .service-item-mock:hover .service-3d-underlay {
      transform: translateY(-7px) scale(1.12);
      filter: drop-shadow(0 12px 24px rgba(52, 120, 246, 0.65)) brightness(1.08);
    }
    .service-item-mock h4 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      color: #fff;
    }

    /* SVG Formation Component */
    .logo-service-anim-svg {
      width: 68px;
      height: 68px;
      position: absolute;
      top: 4px;
      left: 4px;
      z-index: 2;
      overflow: visible;
      will-change: transform, filter;
      animation: logoEntranceGlow 1.8s ease-out forwards;
    }

    /* Phase 1: Strokes */
    .l-streak {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 5px #3478F6) drop-shadow(0 0 10px #80B5FF);
      opacity: 0;
    }
    .l-streak-arc {
      stroke: #80B5FF;
      stroke-width: 3.5;
      stroke-dasharray: 180;
      stroke-dashoffset: 180;
      animation: drawStreak 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
    }
    .l-streak-handle {
      stroke: #80B5FF;
      stroke-width: 2.2;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawStreak 0.70s cubic-bezier(0.16, 1, 0.3, 1) 0.12s forwards;
    }
    .l-streak-nib {
      stroke: #3478F6;
      stroke-width: 3.2;
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      animation: drawStreak 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
    }
    .l-streak-slit {
      stroke: #FFFFFF;
      stroke-width: 2.5;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: drawStreak 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.32s forwards;
    }
    .l-streak-base {
      stroke: #3478F6;
      stroke-width: 2.8;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawStreak 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
    }

    /* Phase 2: Facets */
    .l-facet {
      opacity: 0;
      transform-origin: 76px 82px;
      animation: assembleFacet 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.48s forwards;
    }

    /* Phase 3: Nodes */
    .l-node {
      opacity: 0;
      transform-origin: center;
      fill: #FFFFFF;
      animation: flashNode 0.5s ease-out 0.70s forwards;
    }

    /* Phase 4: Energy Beam Sweep */
    .l-energy-beam {
      opacity: 0;
      transform: translateX(-50px);
      animation: sweepBeamNib 0.85s ease-out 0.65s forwards;
    }
    @keyframes sweepBeamNib {
      0% { opacity: 0; transform: translateX(-50px); }
      30% { opacity: 0.85; }
      80% { opacity: 0.6; }
      100% { opacity: 0; transform: translateX(170px); }
    }

    /* Phase 5: Underlying 3D Icon Crossfade & Settle */
    .service-anim-active .service-3d-underlay {
      animation: revealUnderlay 0.65s ease-out 0.75s forwards;
    }
    @keyframes revealUnderlay {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Settled state: Clean, Stable, Fully Interactive */
    .service-anim-revealed .logo-service-anim-svg {
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .service-anim-revealed .service-3d-underlay {
      opacity: 1 !important;
      transform: none !important;
      animation: none !important;
    }
  </style>
</head>
<body>

  <h1>DIGENZ — Header Logo Reveal vs Logo Design Icon Reveal</h1>
  <p class="sub">Direct side-by-side verification: Reusing exact strokes, nodes, facets, beam sweep, and timing</p>
  <button class="btn-replay" onclick="replayAll()">Replay Both Animations</button>

  <div class="comparison-container">
    
    <!-- 1. Header Logo -->
    <div class="card">
      <h3>1. DIGENZ Header Logo Reveal (Reference)</h3>
      <div id="logoContainer">
        <div class="digenz-logo-anim-wrap">
          <svg class="digenz-logo-anim-svg" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 92">
            <defs>

                <path class="wm-letter wm-e" d="M 202,23 L 228.5,23 L 228.5,28.5 L 208,28.5 L 208,37.8 L 225.5,37.8 L 225.5,43.2 L 208,43.2 L 208,53.5 L 229,53.5 L 229,59 L 202,59 Z" />

              <text class="wm-tagline" x="93" y="74" font-family="'Century Gothic', 'Montserrat', -apple-system, sans-serif" font-size="6.8" font-weight="600" letter-spacing="3.8" fill="#80B5FF">DIGITAL • CREATIVE • SERVICES</text>

        </div>
      </div>
    </div>

    <!-- 2. Logo Design Service Icon -->
    <div class="card">
      <h3>2. Logo Design Service Icon (Matched Formation Technique)</h3>
      <div id="serviceIconContainer">
        <div class="service-item-mock service-anim-active" id="logoServiceItem">
          <div class="service-figure">
            <!-- Phase 5: Underlying 3D Artwork (Resolves seamlessly into final resting state) -->
            <img src="/assets/images/services-3d/logo-design.png" alt="Logo Design" class="service-3d-underlay" width="68" height="68">

            <!-- Phases 1–4: SVG Formation Component (Exact Same Technique) -->
            <svg class="logo-service-anim-svg" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 152">
              <defs>
                <linearGradient id="nib_blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#80B5FF" />
                  <stop offset="30%" stop-color="#3478F6" />
                  <stop offset="70%" stop-color="#1e5dd6" />
                  <stop offset="100%" stop-color="#103c8c" />
                </linearGradient>
                <linearGradient id="nib_blueLight" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#3478F6" />
                  <stop offset="45%" stop-color="#80B5FF" />
                  <stop offset="100%" stop-color="#FFFFFF" />
                </linearGradient>
                <linearGradient id="nib_blueDark" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#1e5dd6" />
                  <stop offset="100%" stop-color="#0f2b66" />
                </linearGradient>
                <linearGradient id="nib_whiteFacet" x1="0%" y1="0%" x2="100%" y2="100%">

                <polygon class="l-facet" points="76,112 51,82 61,58 76,58 76,82" fill="url(#nib_whiteFacet)" />

  <script>
    var logoHtml = document.getElementById('logoContainer').innerHTML;
    var serviceHtml = document.getElementById('serviceIconContainer').innerHTML;

    function replayAll() {
      var logoC = document.getElementById('logoContainer');
      var servC = document.getElementById('serviceIconContainer');
      
      logoC.innerHTML = '';
      servC.innerHTML = '';

      void logoC.offsetWidth;
      void servC.offsetWidth;

      logoC.innerHTML = logoHtml;
      servC.innerHTML = serviceHtml;

      setTimeout(function() {
        var servItem = document.getElementById('logoServiceItem');
        if (servItem) {
          servItem.classList.remove('service-anim-active');
