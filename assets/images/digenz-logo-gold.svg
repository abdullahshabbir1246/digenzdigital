<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
     width="350px" height="92px" viewBox="0 0 350 92" xml:space="preserve">
  <defs>
    <linearGradient id="d_blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80B5FF" />
      <stop offset="30%" stop-color="#3478F6" />
      <stop offset="70%" stop-color="#1e5dd6" />
      <stop offset="100%" stop-color="#103c8c" />
    </linearGradient>
    <linearGradient id="d_blueLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3478F6" />
      <stop offset="50%" stop-color="#80B5FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="d_blueDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e5dd6" />
      <stop offset="100%" stop-color="#0f2b66" />
    </linearGradient>
    <linearGradient id="d_blueMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e5dd6" />
      <stop offset="50%" stop-color="#3478F6" />
      <stop offset="100%" stop-color="#80B5FF" />
    </linearGradient>
  </defs>

  <!-- Modern Geometric 'D' Monogram for Digital & Creative Services -->
  <g id="d_techD" transform="translate(6, 1)">
    <!-- Left Tech Pillar (Foundation, Backend Architecture, Structure) -->
    <!-- Top Chamfered Pillar Segment -->
    <polygon points="18,27 26,19 32,19 32,44 18,44" 
             fill="url(#d_blueLight)" />
    <!-- Bottom Chamfered Pillar Segment -->
    <polygon points="18,48 32,48 32,73 26,73 18,65" 
             fill="url(#d_blueDark)" />

    <!-- Center Bridge Node (Connectivity, API & Data Flow) -->
    <polygon points="28,43 36,43 36,49 28,49" 
             fill="url(#d_blueGrad)" />

    <!-- Right Dynamic Geometric 'D' Loop (Frontend, Innovation, Creative Solutions) -->
    <!-- Top Horizontal & Diagonal Chamfer -->
    <polygon points="38,19 56,19 72,35 60,35 48,27 38,27" 
             fill="url(#d_blueLight)" />

    <!-- Right Vertical Data Spine -->
    <polygon points="72,35 72,57 60,57 60,35" 
             fill="url(#d_blueGrad)" />

    <!-- Bottom Horizontal & Diagonal Chamfer -->
    <polygon points="72,57 56,73 38,73 38,65 48,65 60,57" 
             fill="url(#d_blueDark)" />

    <!-- Digital Forward Arrow Core (representing Progress, Code, Innovation) -->
    <polygon points="41,36 51,46 41,56 46,56 56,46 46,36" 
             fill="url(#d_blueLight)" opacity="0.95" />

    <!-- Tech Nodes at Apex -->
    <circle cx="26" cy="19" r="2.2" fill="#FFFFFF" />
    <circle cx="56" cy="19" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- DIGENZ Vector Wordmark & Tagline -->
  <g id="d_wordmark">
    <!-- DIGENZ Crisp White Typography -->
    <g fill="#FFFFFF">
      <!-- D: x = 92 to 126 -->
      <path d="M 92,23 L 110,23 C 121,23 127.5,29.5 127.5,41 C 127.5,52.5 121,59 110,59 L 92,59 Z 
               M 98,28.5 L 98,53.5 L 109.5,53.5 C 116.5,53.5 121,49 121,41 C 121,33 116.5,28.5 109.5,28.5 Z" />

      <!-- I: x = 137 to 143 -->
      <path d="M 137,23 L 143,23 L 143,59 L 137,59 Z" />

      <!-- G: x = 153 to 191 -->
      <path d="M 189,32 L 183.8,35.5 C 181,31.2 176.5,29 171.5,29 C 161.8,29 155.5,35.5 155.5,41 C 155.5,46.5 161.8,53 172,53 C 179.2,53 183.5,49.2 183.5,44.2 L 172,44.2 L 172,39.5 L 189.5,39.5 L 189.5,48.5 C 185.8,54.8 179.2,58.5 171.5,58.5 C 158.5,58.5 149.5,51 149.5,41 C 149.5,31 158.8,23.5 171.5,23.5 C 179.5,23.5 185.5,27 189,32 Z" />

      <!-- E: x = 202 to 229 -->
      <path d="M 202,23 L 228.5,23 L 228.5,28.5 L 208,28.5 L 208,37.8 L 225.5,37.8 L 225.5,43.2 L 208,43.2 L 208,53.5 L 229,53.5 L 229,59 L 202,59 Z" />

      <!-- N: x = 240 to 275 -->
      <path d="M 240,23 L 246,23 L 268.5,51.5 L 268.5,23 L 274.5,23 L 274.5,59 L 268.5,59 L 246,30.5 L 246,59 L 240,59 Z" />

      <!-- Z: x = 286 to 320 -->
      <path d="M 286,23 L 319.5,23 L 319.5,28.5 L 295.5,53.5 L 320,53.5 L 320,59 L 285.5,59 L 285.5,53.5 L 310,28.5 L 286,28.5 Z" />
    </g>

    <!-- Tagline: DIGITAL • CREATIVE • SERVICES in Light Blue -->
    <text x="93" y="74" 
          font-family="'Century Gothic', 'Montserrat', -apple-system, sans-serif" 
          font-size="6.8" 
          font-weight="600" 
          letter-spacing="3.8" 
          fill="#80B5FF" 
          opacity="0.95">DIGITAL • CREATIVE • SERVICES</text>
  </g>
</svg>