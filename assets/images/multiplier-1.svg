<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <!-- Brand Color Gradients -->
    <linearGradient id="d_blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80B5FF" />
      <stop offset="30%" stop-color="#3478F6" />
      <stop offset="70%" stop-color="#1e5dd6" />
      <stop offset="100%" stop-color="#103c8c" />
    </linearGradient>

    <linearGradient id="d_blueLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3478F6" />
      <stop offset="50%" stop-color="#80B5FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="d_blueDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e5dd6" />
      <stop offset="100%" stop-color="#0f2b66" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3478F6" />
      <stop offset="50%" stop-color="#80B5FF" />
      <stop offset="100%" stop-color="#3478F6" />
    </linearGradient>

    <radialGradient id="screenGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#172847" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0E1624" stop-opacity="0.95" />
    </radialGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background (Exact #101827 to seamlessly match .x-factor-section) -->
  <rect width="600" height="450" fill="#101827" />

  <!-- Outer Frame Inset Border (Sharp Technical Rectangle) -->
  <rect x="20" y="20" width="560" height="410" 
        fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Laptop Screen Inner Glass Background -->
  <rect x="118" y="76" width="364" height="224" rx="4" ry="4"
        fill="url(#screenGlow)" />

  <!-- Laptop Screen Outer Frame (Electric Blue) -->
  <rect x="118" y="76" width="364" height="224" rx="4" ry="4"
        fill="none" stroke="#3478F6" stroke-width="2.5" />

  <!-- Laptop Screen Camera Indicator -->
  <circle cx="300" cy="82" r="1.5" fill="#80B5FF" opacity="0.75" />

  <!-- Laptop Base (Electric Blue with Ice Blue Top Highlight) -->
  <rect x="90" y="306" width="420" height="4.5" rx="2" ry="2" fill="#3478F6" />
  <line x1="94" y1="306.5" x2="506" y2="306.5" stroke="#80B5FF" stroke-width="1" opacity="0.8" />

  <!-- Official DIGENZ Faceted Monogram Logo inside Screen -->
  <g transform="translate(300, 184) scale(1.35) translate(-45, -46)">
    <!-- Left Tech Pillar -->
    <polygon points="18,27 26,19 32,19 32,44 18,44" fill="url(#d_blueLight)" />
    <polygon points="18,48 32,48 32,73 26,73 18,65" fill="url(#d_blueDark)" />

    <!-- Center Bridge Node -->
    <polygon points="28,43 36,43 36,49 28,49" fill="url(#d_blueGrad)" />

    <!-- Right Dynamic Geometric 'D' Loop -->
    <polygon points="38,19 56,19 72,35 60,35 48,27 38,27" fill="url(#d_blueLight)" />
    <polygon points="72,35 72,57 60,57 60,35" fill="url(#d_blueGrad)" />
    <polygon points="72,57 56,73 38,73 38,65 48,65 60,57" fill="url(#d_blueDark)" />

    <!-- Digital Forward Arrow Core -->
    <polygon points="41,36 51,46 41,56 46,56 56,46 46,36" fill="url(#d_blueLight)" opacity="0.95" />

    <!-- Tech Nodes at Apex -->
    <circle cx="26" cy="19" r="2.2" fill="#FFFFFF" />
    <circle cx="56" cy="19" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- Typography: MULTIPLIER 1 (Crisp White Bold Sans-Serif) -->
  <text x="300" y="358" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Century Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="26" 
        font-weight="800" 
        letter-spacing="2.5" 
        fill="#FFFFFF">MULTIPLIER 1</text>

  <!-- Typography: DIGENZ DIGITAL SOLUTIONS (Ice Blue Tracked Sans-Serif) -->
  <text x="300" y="390" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Century Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="11.5" 
        font-weight="600" 
        letter-spacing="4.5" 
        fill="#80B5FF">DIGENZ DIGITAL SOLUTIONS</text>
</svg>