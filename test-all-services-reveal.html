<html lang="en">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 20px;
      background: #101827; /* DIGENZ Midnight Navy */
      font-family: 'Bai Jamjuree', sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-align: center;
    }
    p.sub {
      color: #80B5FF;
      font-size: 13px;
      margin-bottom: 25px;
      text-align: center;
    }
    .btn-replay {
      background: linear-gradient(135deg, #3478F6 0%, #1a56c4 100%);
      color: #fff;
      border: none;
      padding: 12px 32px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(52, 120, 246, 0.4);
      margin-bottom: 35px;
      transition: all 0.2s ease;
    }
    .btn-replay:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(52, 120, 246, 0.6);
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      width: 100%;
      max-width: 1100px;
    }
    @media (max-width: 900px) {
      .services-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) {
      .services-grid { grid-template-columns: 1fr; }
    }

    .service-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(52, 120, 246, 0.25);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      position: relative;
    }
    .service-card h4 {
      font-size: 14px;
      font-weight: 600;
      margin: 12px 0 0 0;
      color: #fff;
    }

    .service-figure {
      width: 76px;
      height: 76px;
      margin: 0 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .service-3d-underlay {
      width: 68px;
      height: 68px;
      object-fit: contain;
      display: block;
      position: absolute;
      top: 4px;
      left: 4px;
      z-index: 1;
      filter: drop-shadow(0 4px 14px rgba(52, 120, 246, 0.32));
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.35s ease;
    }

    .service-anim-svg {
      position: absolute !important;
      top: 4px !important;
      left: 4px !important;
      width: 68px !important;
      height: 68px !important;
      pointer-events: none !important;
      z-index: 10 !important;
      overflow: visible !important;
      display: block !important;
      animation: logoEntranceGlow 1.8s ease-out forwards;
    }

    /* Phase 1: Dynamic Light Trails */
    .l-streak {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 5px #3478F6) drop-shadow(0 0 10px #80B5FF);
      opacity: 0;
    }
    .l-streak-arc {
      stroke: #80B5FF;
      stroke-width: 3.5;
      stroke-dasharray: 180;
      stroke-dashoffset: 180;
      animation: drawStreak 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
    }
    .l-streak-handle {
      stroke: #80B5FF;
      stroke-width: 2.2;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawStreak 0.70s cubic-bezier(0.16, 1, 0.3, 1) 0.12s forwards;
    }
    .l-streak-nib,
    .l-streak-primary {
      stroke: #3478F6;
      stroke-width: 3.2;
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      animation: drawStreak 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
    }
    .l-streak-secondary {
      stroke: #80B5FF;
      stroke-width: 2.6;
      stroke-dasharray: 220;
      stroke-dashoffset: 220;
      animation: drawStreak 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.10s forwards;
    }
    .l-streak-slit,
    .l-streak-accent {
      stroke: #FFFFFF;
      stroke-width: 2.5;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: drawStreak 0.60s cubic-bezier(0.16, 1, 0.3, 1) 0.32s forwards;
    }
    .l-streak-base {
      stroke: #3478F6;
      stroke-width: 2.8;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawStreak 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
    }

    /* Phase 2: Facets */
    .l-facet {
      opacity: 0;
      transform-origin: center;
      animation: assembleFacet 0.60s cubic-bezier(0.16, 1, 0.3, 1) 0.48s forwards;
    }

    /* Phase 3: Nodes */
    .l-node {
      opacity: 0;
      transform-origin: center;
      fill: #FFFFFF;
      animation: flashNode 0.50s ease-out 0.70s forwards;
    }

    /* Phase 4: Energy Sweep Beam */
    .l-energy-beam {
      opacity: 0;
      transform: translateX(-50px);
      animation: sweepBeamNib 0.85s ease-out 0.65s forwards;
    }

    /* Phase 5: Underlying 3D Icon crossfade */
    .animating .service-3d-underlay {
      animation: revealUnderlay 0.65s ease-out 0.75s both;
    }

    @keyframes drawStreak {
      0% { stroke-dashoffset: 260; opacity: 0; }
      20% { opacity: 1; }
      80% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes assembleFacet {
      0% { opacity: 0; transform: scale(0.85); }
      70% { opacity: 1; transform: scale(1.03); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes flashNode {
      0% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(2.2); filter: drop-shadow(0 0 6px #FFFFFF); }
      100% { opacity: 1; transform: scale(1); filter: none; }
    }
    @keyframes sweepBeamNib {
      0% { opacity: 0; transform: translateX(-50px); }
      30% { opacity: 0.85; }
      80% { opacity: 0.6; }
      100% { opacity: 0; transform: translateX(170px); }
    }
    @keyframes revealUnderlay {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes logoEntranceGlow {
      0% { filter: drop-shadow(0 0 4px rgba(52, 120, 246, 0.2)); }
      50% { filter: drop-shadow(0 0 12px rgba(52, 120, 246, 0.65)) drop-shadow(0 0 4px rgba(128, 181, 255, 0.8)); }
      100% { filter: drop-shadow(0 0 0px transparent); }
    }

    /* Settled state */
    .revealed .service-anim-svg {
      opacity: 0 !important;
      transition: opacity 0.3s ease !important;
      pointer-events: none !important;
    }
    .revealed .service-3d-underlay {
      opacity: 1 !important;
      transform: none !important;
    }
  </style>

    var grid = document.getElementById('servicesGrid');

    function renderCards() {
      grid.innerHTML = '';
      services.forEach(function(s, idx) {
        var card = document.createElement('div');
        card.className = 'service-card animating';
        card.id = 'card-' + s.id;
        card.innerHTML = 
          '<div class="service-figure">' +
            '<img src="' + s.img + '" alt="' + s.title + '" class="service-3d-underlay" width="68" height="68">' +
            s.svg +
          '</div>' +
          '<h4>' + s.title + '</h4>';
        grid.appendChild(card);
      });

      setTimeout(function() {
        services.forEach(function(s) {
          var el = document.getElementById('card-' + s.id);
          if (el) {
            el.classList.remove('animating');
            el.classList.add('revealed');
          }
        });
      }, 2000);
    }

    function replayAll() {
      renderCards();
    }

    window.addEventListener('DOMContentLoaded', function() {
      renderCards();
    });
